name: Deploy ke GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * 1-5"
    - cron: "0 */2 * * 0,6"
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa buat prediksi baru sekarang"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Opsional: jalankan test cepat sebelum deploy
      - name: Uji aturan & statistik
        run: |
          node scripts/test-backtest.mjs || echo "test-backtest gagal (non-blocking)"
          node scripts/test-forward.mjs  || echo "test-forward gagal (non-blocking)"
        continue-on-error: true

      - name: Update jurnal sinyal
        run: node scripts/jurnal.mjs
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
          USE_AI: ${{ vars.USE_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Forward test - verifikasi integritas
        run: node scripts/forward.mjs verify
        continue-on-error: true

      - name: Forward test - laporan
        run: node scripts/forward.mjs report
        continue-on-error: true

      - name: Commit data jurnal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "chore: update jurnal [skip ci]"
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
